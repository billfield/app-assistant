name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Bootstrap Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Download KaTeX assets
        working-directory: app/src/main/assets/katex
        run: |
          set -e
          curl -fsSL -o katex.zip https://github.com/KaTeX/KaTeX/releases/download/v0.16.11/katex.zip
          unzip -q katex.zip
          cp katex/katex.min.css ./
          cp katex/katex.min.js ./
          mkdir -p fonts
          cp katex/fonts/* fonts/
          rm -rf katex katex.zip

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mathcoach-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
